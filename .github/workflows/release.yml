name: Publish HACS release

on:
  push:
    branches:
      - main
    paths:
      - custom_components/homeon_energy_manager/**
      - hacs.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homeon-energy-manager-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate integration
        shell: bash
        run: |
          set -euo pipefail
          test -f hacs.json
          test -f custom_components/homeon_energy_manager/manifest.json
          python -m compileall -q custom_components/homeon_energy_manager
          python -m json.tool hacs.json >/dev/null
          python -m json.tool custom_components/homeon_energy_manager/manifest.json >/dev/null
          python -m json.tool custom_components/homeon_energy_manager/translations/pl.json >/dev/null
          python -m json.tool custom_components/homeon_energy_manager/translations/en.json >/dev/null
          python -m unittest discover -s tests -v

      - name: Read integration version
        id: version
        shell: bash
        run: |
          version="$(python -c 'import json; print(json.load(open("custom_components/homeon_energy_manager/manifest.json", encoding="utf-8"))["version"])')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

    outputs:
      version: ${{ steps.version.outputs.version }}

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Publish HACS release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "HomeOn Energy Manager v$VERSION" --generate-notes
          fi

      - name: Keep only the two newest versions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t keep_tags < <(
            gh release list --limit 100 --json tagName,publishedAt \
              --jq 'sort_by(.publishedAt) | reverse | .[0:2] | .[].tagName'
          )
          test "${#keep_tags[@]}" -eq 2

          should_keep() {
            [[ "$1" == "${keep_tags[0]}" || "$1" == "${keep_tags[1]}" ]]
          }

          while IFS= read -r old_tag; do
            [[ -z "$old_tag" ]] && continue
            if ! should_keep "$old_tag"; then
              gh release delete "$old_tag" --yes --cleanup-tag
            fi
          done < <(gh release list --limit 100 --json tagName --jq '.[].tagName')

          while IFS= read -r tag_ref; do
            [[ -z "$tag_ref" ]] && continue
            tag="${tag_ref#refs/tags/}"
            if ! should_keep "$tag"; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"
            fi
          done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags" --jq '.[].ref')

          printf 'Pozostawione wersje: %s, %s\n' "${keep_tags[0]}" "${keep_tags[1]}"

      - name: Remove obsolete merged branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r branch; do
            [[ -z "$branch" || "$branch" == "main" ]] && continue
            encoded_branch="${branch//\//%2F}"
            if gh api "repos/$GITHUB_REPOSITORY/branches/$encoded_branch" >/dev/null 2>&1; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$encoded_branch"
            fi
          done < <(
            {
              gh pr list --state merged --limit 100 --json headRefName --jq '.[].headRefName'
              printf '%s\n' 'test/0.2.44-beta.1'
            } | sort -u
          )
